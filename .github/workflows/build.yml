name: Build

# push-only: no pull_request trigger — workflows must never run on
# third-party PRs (untrusted code + secrets exposure)
on:
  push:
    branches: [main]
    # version tags build the same firmware and additionally publish it as a
    # GitHub release (see the tag-only steps below)
    tags: ["v*"]

jobs:
  build-x4:
    runs-on: ubuntu-latest
    permissions:
      # needed only by the tag-only publish step
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify pins match versions.env
        run: |
          set -eu
          . ./versions.env
          grep -q "releases/download/${PIOARDUINO_VERSION}/platform-espressif32.zip" platformio.ini
          grep -q "ArduinoJson @ ${ARDUINOJSON_VERSION}" platformio.ini
          # gitlink (tree entry) vs the mirrored ref; works without checkout
          test "$(git rev-parse HEAD:vendor/freeink-sdk)" = "$FREEINK_SDK_REF"
      - name: Install PlatformIO (pinned in versions.env)
        run: |
          set -eu
          . ./versions.env
          python -m pip install --upgrade pip "platformio==${PLATFORMIO_VERSION}"
      - name: Build firmware (dev env x4 + release env x4_release)
        run: pio run -e x4 -e x4_release
      - name: Stage release assets (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -eu
          VERSION="$(sed -n 's/.*kAppVersion *= *"\([^"]*\)".*/\1/p' src/AppVersion.h)"
          test -n "$VERSION"
          # the tag must carry exactly the version baked into the firmware
          test "v${VERSION}" = "${GITHUB_REF_NAME}" || {
            echo "tag ${GITHUB_REF_NAME} != AppVersion.h ${VERSION}" >&2; exit 1; }
          mkdir -p dist
          cp .pio/build/x4_release/firmware.bin "dist/freedea-x4-${VERSION}.bin"
          # run inside dist/ so the checksum file names the plain asset file
          # (users verify with sha256sum -c next to the downloaded .bin)
          (cd dist && sha256sum "freedea-x4-${VERSION}.bin" > "freedea-x4-${VERSION}.bin.sha256")
      - name: Build user manual PDF (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc weasyprint fonts-noto-core
          VERSION="$(sed -n 's/.*kAppVersion *= *"\([^"]*\)".*/\1/p' src/AppVersion.h)"
          bin/build_manual_pdf.sh docs/USER_MANUAL.md "dist/freedea-user-manual-${VERSION}.pdf"
      - name: Publish GitHub release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          VERSION="$(sed -n 's/.*kAppVersion *= *"\([^"]*\)".*/\1/p' src/AppVersion.h)"
          # re-runs of an existing tag keep the release and replace its assets
          gh release create "${GITHUB_REF_NAME}" \
            --title "Freedea ${VERSION}" \
            --notes-file RELEASE_NOTES.md \
            "dist/freedea-x4-${VERSION}.bin" \
            "dist/freedea-x4-${VERSION}.bin.sha256" \
            "dist/freedea-user-manual-${VERSION}.pdf" \
            || gh release upload "${GITHUB_REF_NAME}" \
              "dist/freedea-x4-${VERSION}.bin" \
              "dist/freedea-x4-${VERSION}.bin.sha256" \
              "dist/freedea-user-manual-${VERSION}.pdf" --clobber
