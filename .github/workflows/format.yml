name: Format

# push-only: no pull_request trigger — workflows must never run on
# third-party PRs (untrusted code + secrets exposure)
on:
  push:
    branches: [main]

jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install clang-format (pinned in versions.env)
        run: |
          . ./versions.env
          python -m pip install "clang-format==${CLANG_FORMAT_VERSION}"
      - name: Reformat tracked files, fail if the tree was not already clean
        run: |
          ./bin/clang-format-fix
          git diff --exit-code
