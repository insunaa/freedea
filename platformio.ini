; Freedea — WiFi Midea AC remote for the Xteink X4 (ESP32-C3, 16 MB flash, no PSRAM).
; One binary: `pio run -e x4`.
;
; Built on the FreeInk SDK (vendored as a pinned git submodule at
; vendor/freeink-sdk — run `git submodule update --init` after cloning).
; The [base] section mirrors vendor/freeink-sdk/platformio.sample.ini.

[platformio]
default_envs = x4
; Optional local override (gitignored): platformio.local.ini repoints the SDK
; lib_deps at a sibling freeink-sdk checkout so SDK changes build directly
; without bumping the vendor submodule. Absent on a fresh clone, which then
; builds self-contained against vendor/freeink-sdk.
extra_configs = platformio.local.ini

[base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
  -std=gnu++2a
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; Single framebuffer: the C3's DRAM holds only one 48 KB frame (no PSRAM).
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1

build_unflags =
  -std=gnu++11

; The Xteink X4 module is wired for DIO / 16 MB.
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv

; FreeInk SDK libraries (paths resolve inside the vendor submodule). SdFat is
; pulled in automatically as a dependency of SDCardManager.
lib_deps =
  BoardConfig=symlink://vendor/freeink-sdk/libs/hardware/BoardConfig
  EInkDisplay=symlink://vendor/freeink-sdk/libs/display/FreeInkDisplay
  InputManager=symlink://vendor/freeink-sdk/libs/hardware/InputManager
  BatteryMonitor=symlink://vendor/freeink-sdk/libs/hardware/BatteryMonitor
  PowerManager=symlink://vendor/freeink-sdk/libs/hardware/PowerManager
  SDCardManager=symlink://vendor/freeink-sdk/libs/hardware/SDCardManager
  FreeInkUI=symlink://vendor/freeink-sdk/libs/ui/FreeInkUI
  Icons=symlink://vendor/freeink-sdk/libs/assets/Icons
  bblanchon/ArduinoJson @ 7.4.2

; --- Xteink X4 — ESP32-C3, SSD1677 800x480, buttons only, no PSRAM -----------
[env:x4]
extends = base
board = esp32-c3-devkitm-1
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4=1
  ; Debug: dump /.freedea contents to serial on boot (drop for releases).
  -DFREEDDEA_DEBUG_FS=1
  ; Debug: WG bring-up diagnostics — resolved endpoint IP and handshake
  ; packet tx/rx logs in the vendored stack (drop for releases). The NTP
  ; sync before bring-up is NOT gated: the server needs real timestamps.
  -DFREEDDEA_DEBUG_WG=1
  ; Debug (R.4.2): per-init-stage heap trace + 1 s free-heap floor line
  ; (drop for releases; the compact boot summary line is unconditional).
  -DFREEDDEA_DEBUG_MEM=1

; --- Xteink X4 release build ----------------------------------------------------
; Same binary surface as env:x4 minus the debug-only diagnostics (flag-gated:
; the /.freedea FS dump and WG bring-up traces disappear at compile time).
; This is the env for shipping artifacts (bin/build_docker.sh defaults here).
; Note: boot/status Serial output is unconditional in the sources (no log-level
; machinery); this env removes the debug-gated extras only.
[env:x4_release]
extends = base
board = esp32-c3-devkitm-1
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4=1

; --- 5.2 fault-injection test build ------------------------------------------
; Corrupts every 4th received AC packet (payload or declared size) to drive
; the protocol-error paths end to end on device: toast + log + session
; teardown + auto-reconnect, never a reboot. Debug-only; never ship this.
[env:x4_faultinject]
extends = env:x4
build_flags =
  ${env:x4.build_flags}
  -DFREEDDEA_FAULT_INJECT=1
